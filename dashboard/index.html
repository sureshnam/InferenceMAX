<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>InferenceMAX Dashboard</title>
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --border: #dfe3ec;
            --text: #0f172a;
            --muted: #6b7280;
            --accent: #2563eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 32px;
        }

        .page { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .title h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
        .subtitle { margin-top: 6px; color: var(--muted); }

        .dataset-picker {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        select {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            min-width: 200px;
            font-size: 14px;
            color: var(--text);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        }

        .filter-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(15,23,42,0.08);
        }

        .panel h2 { margin: 0 0 12px 0; font-size: 18px; }

        .chart-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

        .chart-wrapper { padding: 10px; border: 1px solid var(--border); border-radius: 12px; min-height: 360px; }
        .chart-wrapper h3 { margin: 0 0 6px 0; font-size: 15px; color: var(--muted); }

        .selection {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
            display: grid;
            gap: 6px;
            font-size: 13px;
            color: var(--text);
        }

        .selection-title {
            font-weight: 700;
            font-size: 14px;
        }

        .selection-row { display: grid; gap: 4px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; }
        tbody tr:hover { background: #f4f6fb; }

        .legend { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: #f8fafc; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div class="title">
                <h1>InferenceMAX Dashboard</h1>
            <div class="subtitle">Explore H100 nvupstream runs with selectable model, ISL/OSL, precision, and metrics.</div>
        </div>
        <label class="dataset-picker">
            Workflow run
            <select id="datasetSelect"></select>
        </label>
    </header>

        <div class="filters">
            <div>

            </div>
            <div>

            <div>

            </div>
            <div>

            </div>
        </div>

        <div class="panel">
            <h2>Charts</h2>
            <div class="chart-grid">
                <div class="chart-wrapper">
                    <h3>Y-axis metric vs concurrency</h3>

                </div>
                <div class="chart-wrapper">

            </div>
            <div class="selection" id="selectionBox" hidden>

        </div>

        let selectedPoint = null;

        const metricOptions = {
            throughput_per_gpu: { label: 'Token Throughput per GPU', format: (v) => `${v.toFixed(1)} tok/s` },
            e2e_latency: { label: 'E2E Latency (s)', format: (v) => `${v.toFixed(2)} s` },
            interactivity: { label: 'Interactivity', format: (v) => v.toFixed(2) },
            ttft: { label: 'TTFT (s)', format: (v) => v ? `${v.toFixed(3)} s` : '-' },
        };

        const datasetSources = {
            'gptoss-h100': { label: 'H100 gpt-oss (latest)', src: 'gptoss_h100.json' },
            'h100-nvupstream': { label: 'nvupstream H100 sample', src: 'h100_results.json' },
            'gaudi3-sample': { label: 'Gaudi3 sample', src: 'results.json' },
        };

        const embeddedDatasets = {
            'gptoss-h100': JSON.parse(document.getElementById('data-gptoss-h100').textContent),
            'h100-nvupstream': JSON.parse(document.getElementById('data-h100-nvupstream').textContent)
        };

        document.getElementById('datasetSelect').addEventListener('change', loadData);
        document.getElementById('modelFilter').addEventListener('change', refreshUI);
        document.getElementById('islOslFilter').addEventListener('change', refreshUI);
        document.getElementById('precisionFilter').addEventListener('change', refreshUI);
        document.getElementById('yMetric').addEventListener('change', refreshUI);

        populateDatasetSelect();
        loadData();

        function resolveSrc(src) {
            const base = new URL(window.location.href);
            if (!base.pathname.endsWith('/')) {
                base.pathname = base.pathname.substring(0, base.pathname.lastIndexOf('/') + 1);
            }
            return new URL(src, base).toString();
        }

        async function loadData() {
            const datasetSelect = document.getElementById('datasetSelect');
            if (!datasetSelect.value) {
                datasetSelect.value = Object.keys(datasetSources)[0];
            }

            const datasetId = datasetSelect.value;
            const dataset = datasetSources[datasetId];
            if (!dataset) {
                showSelectionMessage('Dataset not found.');
                return;
            }

            try {
                const resp = await fetch(resolveSrc(dataset.src), { cache: 'no-store' });
                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }
                const payload = await resp.json();
                applyPayload(payload, dataset);
            } catch (err) {
                const embedded = embeddedDatasets[datasetId];
                if (embedded) {
                    console.warn('Falling back to embedded dataset', datasetId, err);
                    applyPayload(embedded, dataset);
                } else {
                    console.error('Failed to load dataset', err);
                    showSelectionMessage('Could not load data file.');
                }
            }
        }

        function applyPayload(payload, dataset) {
            const { entries } = unpackPayload(payload, dataset);
            rawData = normalize(entries);
            populateFilterOptions(rawData);
            refreshUI();
        }

        function unpackPayload(payload, dataset) {
            if (Array.isArray(payload)) {
                return { entries: payload, meta: { runName: dataset.label, runDate: '-', workflowUrl: dataset.src } };
            }
            return {
                entries: payload.entries || [],
                meta: {
                    runName: payload.runName || dataset.label,
                    runDate: payload.runDate || '-',
                    workflowUrl: payload.workflowUrl || dataset.src,
                }
            };
        }

        function normalize(rows) {
            return rows.map((r) => {
                const isl = r.isl || (r.isl_osl ? String(r.isl_osl).split('/')[0] : 'Y');
                const osl = r.osl || (r.isl_osl ? String(r.isl_osl).split('/')[1] : 'Y');
                return {
                    hardware: r.hardware || r.hw || 'H100',
                    model: r.model || 'Unknown model',
                    precision: (r.precision || r.prec || 'unknown').toLowerCase(),
                    tp: Number(r.tp || r.tensor_parallel || 1),
                    concurrency: Number(r.concurrency || r.conc || r.concurency || 0),
                    throughput_per_gpu: Number(r.throughput_per_gpu || r.tput_per_gpu || 0),
                    e2e_latency: Number(r.e2e_latency || r.mean_e2el || 0),
                    interactivity: Number(r.interactivity || r.mean_intvty || 0),
                    ttft: r.ttft !== undefined ? Number(r.ttft) : Number(r.mean_ttft || 0),
                    isl,
                    osl,
                    isl_osl: `${isl}/${osl}`
                };
            });
        }

        function populateDatasetSelect() {
            const select = document.getElementById('datasetSelect');
            select.innerHTML = Object.entries(datasetSources)
                .map(([id, d]) => `<option value="${id}">${d.label}</option>`)
                .join('');
            select.value = select.options.length ? select.options[0].value : '';
        }

        function populateFilterOptions(rows) {
            const modelSelect = document.getElementById('modelFilter');
            const islSelect = document.getElementById('islOslFilter');
            const precisionSelect = document.getElementById('precisionFilter');
            const metricSelect = document.getElementById('yMetric');

            const uniqueModels = ['all', ...new Set(rows.map(r => r.model))];
            modelSelect.innerHTML = uniqueModels.map(m => `<option value="${m}">${m === 'all' ? 'All models' : m}</option>`).join('');

            const uniqueIslOsl = ['all', ...new Set(rows.map(r => r.isl_osl))];
            islSelect.innerHTML = uniqueIslOsl.map(v => `<option value="${v}">${v === 'all' ? 'All' : v}</option>`).join('');

            const uniquePrec = ['all', ...new Set(rows.map(r => r.precision))];
            precisionSelect.innerHTML = uniquePrec.map(p => `<option value="${p}">${p === 'all' ? 'All' : p.toUpperCase()}</option>`).join('');

            metricSelect.innerHTML = Object.entries(metricOptions)
                .map(([key, meta]) => `<option value="${key}">${meta.label}</option>`)
                .join('');
            metricSelect.value = 'throughput_per_gpu';
        }

        function applyFilters(data) {
            const model = document.getElementById('modelFilter').value;
            const islOsl = document.getElementById('islOslFilter').value;
            const precision = document.getElementById('precisionFilter').value;
            return data.filter(r => {
                if (model !== 'all' && r.model !== model) return false;
                if (islOsl !== 'all' && r.isl_osl !== islOsl) return false;
                if (precision !== 'all' && r.precision !== precision) return false;
                return true;
            });
        }

        function refreshUI() {
            clearSelectionBox();
            const filtered = applyFilters(rawData);
            if (!filtered.length) {
                showSelectionMessage('No datapoints match the selected filters.');
            }
            renderCharts(filtered);
        }

        function groupBy(arr, fn) {
            return arr.reduce((acc, item) => {
                const key = fn(item);
                if (!acc[key]) acc[key] = [];
                acc[key].push(item);
                return acc;
            }, {});
        }

        function isSelected(chartKey, datasetIndex, dataIndex) {
            return selectedPoint && selectedPoint.chartKey === chartKey && selectedPoint.datasetIndex === datasetIndex && selectedPoint.dataIndex === dataIndex;
        }

        function createDataset(name, points, idx, chartKey, mapper, tension = 0.2) {
            const color = palette[idx % palette.length];
            return {
                label: name,
                data: points.map(mapper),
                borderColor: color,
                backgroundColor: color,
                tension,
                pointRadius: (ctx) => isSelected(chartKey, ctx.datasetIndex, ctx.dataIndex) ? 7 : 5,
                pointBackgroundColor: (ctx) => isSelected(chartKey, ctx.datasetIndex, ctx.dataIndex) ? '#0f172a' : color,
                pointBorderColor: (ctx) => isSelected(chartKey, ctx.datasetIndex, ctx.dataIndex) ? '#0f172a' : color,
                borderWidth: 2,
                showLine: true,
            };
        }

        function handlePointClick(chartKey, chart, evt) {
            const elements = chart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
            if (!elements.length) return;
            const { datasetIndex, index } = elements[0];
            const dataset = chart.data.datasets[datasetIndex];
            const point = dataset.data[index];
            selectedPoint = { chartKey, datasetIndex, dataIndex: index, datasetLabel: dataset.label, point };
            updateSelectionBox(chartKey, dataset.label, point);
            chart.update();
        }

        function clearSelectionBox() {
            selectedPoint = null;
            const box = document.getElementById('selectionBox');
            box.hidden = true;
            document.getElementById('selectionDetails').innerHTML = '';
        }

        function showSelectionMessage(message) {
            const box = document.getElementById('selectionBox');
            const details = document.getElementById('selectionDetails');
            details.innerHTML = `<span>${message}</span>`;
            box.hidden = false;
        }

        function updateSelectionBox(chartKey, label, point) {
            const box = document.getElementById('selectionBox');
            const details = document.getElementById('selectionDetails');
            const r = point.raw;
            details.innerHTML = `
                <span><strong>Chart:</strong> ${chartKey === 'metric' ? 'Metric vs Concurrency' : 'Throughput vs Latency'}</span>
                <span><strong>Series:</strong> ${label}</span>
                <span><strong>Model:</strong> ${r.model}</span>
                <span><strong>Precision:</strong> ${r.precision.toUpperCase()}</span>
                <span><strong>TP:</strong> ${r.tp}</span>
                <span><strong>Concurrency:</strong> ${r.concurrency}</span>
                <span><strong>Throughput/GPU:</strong> ${r.throughput_per_gpu.toFixed(1)} tok/s</span>
                <span><strong>E2E latency:</strong> ${r.e2e_latency.toFixed(2)} s</span>
                <span><strong>Interactivity:</strong> ${r.interactivity.toFixed(2)}</span>
                <span><strong>TTFT:</strong> ${r.ttft ? r.ttft.toFixed(3) + ' s' : '-'}</span>
            `;
            box.hidden = false;
        }

        function renderCharts(rows) {
            renderMetricChart(rows);
            renderLatencyChart(rows);
        }

        function renderMetricChart(rows) {
            const metricKey = document.getElementById('yMetric').value;
            const meta = metricOptions[metricKey];
            const ctx = document.getElementById('metricChart');
            if (charts.metricChart) charts.metricChart.destroy();

            const grouped = groupBy(rows, r => `TP${r.tp} · ${r.precision.toUpperCase()}`);
            const datasets = Object.entries(grouped).map(([name, points], idx) => {
                const sorted = [...points].sort((a, b) => a.concurrency - b.concurrency);
                return createDataset(name, sorted, idx, 'metric', (p) => ({
                    x: p.concurrency,
                    y: p[metricKey],
                    raw: p,
                    pointLabel: `${p.model} · C${p.concurrency}`
                }), 0.2);
            });

            charts.metricChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const raw = ctx.raw;
                                    return `${ctx.dataset.label} — ${raw.pointLabel}: ${meta.format(raw.y)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Concurrency' }, grid: { color: 'rgba(15,23,42,0.05)' } },
                        y: { title: { display: true, text: meta.label }, grid: { color: 'rgba(15,23,42,0.05)' } }
                    },
                    onClick: (evt, elements, chart) => handlePointClick('metric', chart, evt),
                    onHover: (event, elements) => {
                        event.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                    }
                }
            });
        }

        function renderLatencyChart(rows) {
            const ctx = document.getElementById('latencyChart');
            if (charts.latencyChart) charts.latencyChart.destroy();

            const grouped = groupBy(rows, r => `TP${r.tp} · ${r.precision.toUpperCase()}`);
            const datasets = Object.entries(grouped).map(([name, points], idx) => {
                const sorted = [...points].sort((a, b) => a.e2e_latency - b.e2e_latency);
                return createDataset(name, sorted, idx, 'latency', (p) => ({
                    x: p.e2e_latency,
                    y: p.throughput_per_gpu,
                    raw: p,
                    pointLabel: `${p.model} · C${p.concurrency}`
                }), 0.15);
            });

            charts.latencyChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const raw = ctx.raw;
                                    return `${ctx.dataset.label} — ${raw.pointLabel}: ${raw.y.toFixed(1)} tok/s @ ${raw.x.toFixed(2)}s`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'E2E Latency (s) ↓' }, grid: { color: 'rgba(15,23,42,0.05)' } },
                        y: { title: { display: true, text: 'Token Throughput per GPU' }, grid: { color: 'rgba(15,23,42,0.05)' } }
                    },
                    onClick: (evt, elements, chart) => handlePointClick('latency', chart, evt),
                    onHover: (event, elements) => {
                        event.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                    }
                }
            });
        }
    </script>
</body>
</html>
